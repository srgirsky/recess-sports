<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Recess Sports — Classic</title>
    <!--
      NOTE the `../fonts/` path. This page moved from the site root to /classic/
      at the v2 cutover, and with Vite's relative base its URLs now resolve
      against /classic/ — a site-root font would 404 as /classic/fonts/.
      Exactly the gotcha v2/index.html has carried since it was written.
    -->
    <style>
      /* Self-hosted Fredoka (SIL OFL) — rounded, friendly, on-brand. Variable weight. */
      @font-face {
        font-family: 'Fredoka';
        font-style: normal;
        font-weight: 400 700;
        font-display: swap;
        src: url('../fonts/fredoka.woff2') format('woff2');
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0d1b2a;
        overflow: hidden;
        /* Kill double-tap-zoom / long-press select so taps register as swings on tablets */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        display: block;
        margin: 0 auto;
      }
      .to-new {
        position: fixed;
        top: 0;
        right: 0;
        z-index: 10;
        margin: 10px;
        padding: 10px 14px;
        min-width: 56px;
        min-height: 44px;
        box-sizing: border-box;
        display: flex;
        align-items: center;
        border-radius: 12px;
        background: rgb(20 32 46 / 0.8);
        color: #fff4de;
        font: 700 13px/1 Fredoka, system-ui, sans-serif;
        letter-spacing: 0.06em;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <!--
      The way back to the new game. Deliberately in this SHELL and not in v1's
      source: v1 is shipped and frozen, and `git diff main -- src ':!src/v2'`
      staying empty is the review convention this whole rebuild has run under.
      Plain DOM over the canvas, so it costs Phaser nothing.
    -->
    <a class="to-new" href="../">✨ new game</a>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
